<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKFitness Elite Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #08090f;
            --sidebar-bg: rgba(20, 22, 35, 0.6);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.08);
            --primary-accent: #00f0ff;
            --secondary-accent: #7000ff;
            --text-main: #ffffff;
            --text-muted: #a0a5ba;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(16px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; overflow: hidden; position: relative; }
        .gym-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); font-size: 40vw; color: rgba(255, 255, 255, 0.015); pointer-events: none; z-index: 0; }
        .cursor-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; background: radial-gradient(circle 600px at var(--cursor-x, 50%) var(--cursor-y, 50%), rgba(0, 240, 255, 0.08), transparent 40%), radial-gradient(circle 800px at calc(var(--cursor-x, 50%) - 150px) calc(var(--cursor-y, 50%) + 150px), rgba(112, 0, 255, 0.08), transparent 40%); opacity: 0; transition: opacity 1s ease; }
        body:hover .cursor-glow { opacity: 1; }
        .bg-base { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.05), transparent 25%), radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 25%); z-index: 0; pointer-events: none; }
        
        ::-webkit-scrollbar { width: 8px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        
        .app-container { display: flex; width: 100%; height: 100vh; z-index: 10; position: relative; }
        
        /* Sidebar Desktop */
        .sidebar { width: 280px; background: var(--sidebar-bg); backdrop-filter: var(--glass-blur); border-right: 1px solid var(--glass-border); padding: 2rem 1rem; display: flex; flex-direction: column; z-index: 100; animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; padding-left: 1rem; background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; user-select: none; animation: fadeInDown 0.8s 0.2s ease backwards; }
        .nav-section-title { font-size: 0.8rem; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; padding-left: 1.5rem; font-weight: bold;}
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-links li { padding: 1rem 1.5rem; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: 500; display: flex; align-items: center; gap: 1rem; transition: all 0.3s ease; color: var(--text-muted); border: 1px solid transparent; animation: slideInLeft 0.5s ease backwards; }
        .nav-links li:hover { background: var(--card-hover); color: var(--text-main); transform: translateX(5px); }
        .nav-links li.active { background: linear-gradient(90deg, rgba(112, 0, 255, 0.2), transparent); color: var(--primary-accent); border-left: 4px solid var(--primary-accent); border-radius: 4px 12px 12px 4px; }
        
        .main-content { flex: 1; padding: 3rem 4rem; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        
        /* Views */
        .view-section { display: none; animation: fadeIn 0.5s ease backwards; }
        .view-section.active { display: block; }
        
        /* Workout View */
        .days-nav { display: flex; gap: 1rem; list-style: none; overflow-x: auto; padding-bottom: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); }
        .days-nav li { padding: 0.8rem 1.5rem; background: rgba(255,255,255,0.05); border-radius: 50px; cursor: pointer; white-space: nowrap; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); color: var(--text-muted); display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
        .days-nav li:hover { background: var(--card-hover); color: white; transform: translateY(-4px); border-color: rgba(255,255,255,0.1); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .days-nav li.active { background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent)); color: #000; font-weight: bold; transform: scale(1.05); box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3); border-color: transparent; }
        .free-badge { background: #00ff88; color: #000; font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 800; letter-spacing: 1px;}
        
        .day-header h1 { font-family: 'Outfit', sans-serif; font-size: 4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 15px;}
        .day-header p { font-size: 1.2rem; color: var(--primary-accent); font-weight: 500; letter-spacing: 1px; margin-bottom: 3rem;}
        
        .exercises-container { display: flex; flex-direction: column; gap: 2rem; padding-bottom: 4rem; }
        .exercise-card { display: flex; background: var(--card-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 24px; padding: 2rem; gap: 2.5rem; transition: 0.3s ease; animation: fadeInUp 0.6s ease backwards; }
        .exercise-card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(112, 0, 255, 0.1); border-color: rgba(255, 255, 255, 0.15); }
        .exercise-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .exercise-name { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.2; }
        .badges { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .badge { padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;}
        .badge.target { background: rgba(112, 0, 255, 0.2); color: #d6b3ff; border: 1px solid rgba(112, 0, 255, 0.4); }
        .badge.sets { background: rgba(0, 240, 255, 0.15); color: var(--primary-accent); border: 1px solid rgba(0, 240, 255, 0.3); }
        .exercise-desc { font-size: 1.1rem; color: var(--text-muted); line-height: 1.6; background: rgba(0, 0, 0, 0.2); padding: 1.5rem; border-radius: 16px; border-left: 4px solid var(--secondary-accent); }
        .exercise-visual { width: 320px; height: 320px; border-radius: 20px; background: linear-gradient(145deg, #12141f, #0b0c12); border: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; flex-shrink: 0; box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5); }
        
        /* Premium Lock Screen - Added extra height padding and transition for smooth visibility */
        .lock-screen-container { display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; min-height: 50vh; transition: opacity 0.3s ease, transform 0.3s ease; }
        .lock-card { background: var(--card-bg); backdrop-filter: var(--glass-blur); border: 1px solid rgba(112, 0, 255, 0.3); border-radius: 24px; padding: 3rem; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 40px rgba(112, 0, 255, 0.05); }
        .lock-icon { font-size: 4rem; color: var(--secondary-accent); margin-bottom: 1.5rem; text-shadow: 0 0 20px rgba(112,0,255,0.5); }
        .lock-card h2 { font-family: 'Outfit', sans-serif; font-size: 2.2rem; margin-bottom: 1rem; color: #fff;}
        .lock-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem; line-height: 1.5;}
        .input-group { display: flex; flex-direction: column; gap: 1rem; }
        .input-group input, .admin-input { padding: 1.2rem; border-radius: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: #fff; font-size: 1.1rem; outline: none; transition: 0.3s; }
        .input-group input:focus, .admin-input:focus { border-color: var(--primary-accent); box-shadow: 0 0 15px rgba(0,240,255,0.2); }
        .input-group button, .admin-btn { padding: 1.2rem; border-radius: 12px; background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent)); color: #fff; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;}
        .input-group button:hover, .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(112,0,255,0.4); }
        .error-msg { color: #ff3366 !important; margin-top: 1rem; font-weight: bold; font-size: 0.9rem !important; margin-bottom: 0 !important; display: none;}

        #demo-btn { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        #demo-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 30px rgba(112,0,255,0.5); }

        /* Social Cards */
        .social-cards { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 3rem; justify-content: center;}
        .social-card { flex: 1; min-width: 250px; max-width: 300px; background: var(--card-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); padding: 3rem 2rem; border-radius: 24px; text-align: center; cursor: pointer; transition: 0.3s; text-decoration: none; color: white;}
        .social-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); box-shadow: 0 15px 30px rgba(0,0,0,0.3);}
        .social-card i { font-size: 4rem; margin-bottom: 1.5rem; }

        /* Reviews CSS */
        .review-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; animation: fadeInUp 0.5s backwards; }
        .review-stars { color: #ffc107; font-size: 1.2rem; margin-bottom: 10px; }
        .review-name { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; color: #fff;}
        .review-text { color: var(--text-muted); font-size: 1.1rem; line-height: 1.5; font-style: italic;}
        .admin-reply-box { margin-top: 1.5rem; padding: 1rem 1.5rem; background: rgba(0, 240, 255, 0.05); border-left: 4px solid var(--primary-accent); border-radius: 8px; }
        .admin-reply-box h4 { color: var(--primary-accent); margin-bottom: 5px; font-size: 0.9rem; text-transform: uppercase;}
        
        /* Admin Tabs */
        .admin-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;}
        .admin-tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 0.5rem 1rem; transition: 0.3s; font-family: 'Outfit'; font-weight: bold;}
        .admin-tab-btn.active { color: #ff3366; border-bottom: 2px solid #ff3366; }

        .delete-btn-sm, .reply-btn-sm { background: transparent; border: none; color: rgba(255,255,255,0.2); cursor: pointer; font-size: 1.2rem; transition: all 0.3s ease; padding: 5px; margin-right: 10px;}
        .delete-btn-sm:hover { color: #ff3366; transform: scale(1.2); }
        .reply-btn-sm:hover { color: var(--primary-accent); transform: scale(1.2); }

        /* =========================================
           📱 MOBILE RESPONSIVE APP MEDIA QUERIES 
           ========================================= */
        @media (max-width: 768px) {
            .cursor-glow { display: none; } 
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 1rem; border-right: none; border-bottom: 1px solid var(--glass-border); align-items: center; justify-content: center; flex-direction: row; }
            .logo { margin-bottom: 0; padding-left: 0; font-size: 1.8rem; }
            .nav-section-title { display: none; }
            .nav-links { 
                position: fixed; bottom: 0; left: 0; width: 100%; 
                background: rgba(20, 22, 35, 0.98); backdrop-filter: blur(20px);
                flex-direction: row; justify-content: space-around; 
                border-top: 1px solid var(--glass-border); padding: 0.8rem 0; margin: 0; z-index: 1000;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            }
            .nav-links li { flex-direction: column; gap: 5px; font-size: 0.75rem; padding: 0.5rem; border: none !important; border-radius: 8px; justify-content: center; }
            .nav-links li i { font-size: 1.3rem; margin: 0; }
            .nav-links li:hover { transform: none; background: transparent; }
            .nav-links li.active { background: rgba(0, 240, 255, 0.1); border-left: none !important; border-bottom: 3px solid var(--primary-accent) !important; border-radius: 8px; }
            .main-content { padding: 1.5rem; padding-bottom: 120px; }
            #view-home h1 { font-size: 2.8rem !important; }
            #view-home p { font-size: 1.1rem !important; }
            #demo-btn { width: 100%; padding: 1.2rem; }
            .day-header h1 { font-size: 2.5rem; }
            .days-nav { padding-bottom: 1rem; }
            .exercise-card { flex-direction: column; padding: 1.5rem; gap: 1.5rem; }
            .exercise-visual { width: 100% !important; height: 250px !important; }
            .exercise-name { font-size: 1.6rem; }
            .lock-card { padding: 2rem 1.2rem; }
            #view-contact h1 { font-size: 2.2rem !important; }
            .social-card { width: 100%; padding: 2rem 1.5rem; }
            #admin-dashboard-screen { padding: 1.5rem; }
            .admin-tabs { flex-wrap: wrap; }
            .admin-tab-btn { font-size: 0.95rem; flex: 1; padding: 0.5rem; text-align: center; }
            .code-row { flex-direction: column; gap: 1rem; align-items: flex-start !important; }
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="bg-base"></div>
    <div class="cursor-glow"></div>
    <i class="fa-solid fa-dumbbell gym-watermark"></i>

    <div class="app-container">
        <!-- Sidebar / Top Header (on Mobile) -->
        <nav class="sidebar">
            <div class="logo" id="main-logo" title="SKFitness (Tap 5 times for Admin)">
                <i class="fa-solid fa-dumbbell"></i> <span>SKFitness</span>
            </div>
            
            <div class="nav-section-title"><i class="fa-solid fa-bars-staggered" style="margin-right: 5px;"></i> Main Menu</div>
            <!-- Bottom Navigation Bar (on Mobile) -->
            <ul class="nav-links main-menu" id="main-menu">
                <li data-view="home" class="active"><i class="fa-solid fa-house"></i> Home</li>
                <li data-view="workout"><i class="fa-solid fa-fire"></i> VIP Workout</li>
                <li data-view="reviews"><i class="fa-solid fa-star"></i> Reviews</li>
                <li data-view="contact"><i class="fa-solid fa-paper-plane"></i> Contact Me</li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- 1. HOME VIEW -->
            <div id="view-home" class="view-section active">
                <div style="text-align:center; padding: 3rem 0; animation: fadeInUp 0.8s ease;">
                    <div style="display:inline-block; padding: 0.5rem 1.5rem; border-radius: 50px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--primary-accent); margin-bottom: 2rem; font-weight: bold; letter-spacing: 1px;"><i class="fa-solid fa-bolt"></i> ELITE 90-DAY PROGRAM</div>
                    <h1 style="font-size: 4.5rem; margin-bottom: 1.5rem; font-family: 'Outfit', sans-serif; line-height: 1.1;"><i class="fa-solid fa-dumbbell" style="color: #ff3366; font-size: 3.5rem;"></i><br>Build Your Dream<br><span style="color: var(--primary-accent);">Physique Today</span></h1>
                    <p style="font-size: 1.3rem; color: var(--text-muted); margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6;">Stop guessing your workouts. Get a step-by-step professional plan with video guides for every single exercise.</p>
                    <button id="demo-btn" style="padding: 1.2rem 3rem; font-size: 1.2rem; border-radius: 50px; background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent)); color: #fff; border: none; cursor: pointer; font-weight: bold;">View Free Demo <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i></button>
