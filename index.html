        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.nav-links li');
            const dayTitle = document.getElementById('day-title');
            const daySubtitle = document.getElementById('day-subtitle');
            const exercisesContainer = document.getElementById('exercises-container');
            const dayHeader = document.getElementById('day-header');

            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    navLinks.forEach(l => l.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    const selectedDay = e.currentTarget.getAttribute('data-day');
                    
                    exercisesContainer.style.opacity = '0';
                    dayHeader.style.opacity = '0';
                    
                    setTimeout(() => {
                        renderDay(selectedDay);
                        void exercisesContainer.offsetWidth;
                        exercisesContainer.style.opacity = '1';
                        dayHeader.style.opacity = '1';
                    }, 300);
                });
            });

            function renderDay(dayKey) {
                const data = workoutPlan[dayKey];
                if (!data) return;

                dayTitle.textContent = dayKey.toUpperCase();
                daySubtitle.textContent = `${data.title} ${data.focus}`;
                exercisesContainer.innerHTML = '';

                data.exercises.forEach((ex, index) => {
                    const card = document.createElement('div');
                    card.className = 'exercise-card';
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    card.innerHTML = `
                        <div class="exercise-info">
                            <h3 class="exercise-name">${ex.name}</h3>
                            <div class="badges">
                                <span class="badge target"><i class="fa-solid fa-bullseye"></i> ${ex.target}</span>
                                <span class="badge sets"><i class="fa-solid fa-layer-group"></i> ${ex.sets}</span>
                            </div>
                            <p class="exercise-desc">
                                <i class="fa-solid fa-bolt" style="color: var(--primary-accent); margin-right: 8px;"></i>
                                ${ex.effect}
                            </p>
                        </div>
                        <div class="exercise-visual" style="padding: 0; background: transparent; width: ${ex.vWidth || '320px'}; height: ${ex.vHeight || '320px'}; max-width: 100%;">
                            ${ex.video 
                                ? (ex.video.includes('youtube.com') || ex.video.includes('youtu.be')
                                    ? `<iframe width="100%" height="100%" src="${ex.video}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&loop=1&playlist=${ex.video.split('/').pop().split('?')[0]}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 20px; pointer-events: none;"></iframe>`
                                    : `<video width="100%" height="100%" autoplay loop playsinline controls style="border-radius: 20px; object-fit: cover;">
                                         <source src="${ex.video}" type="video/mp4">
                                       </video>`)
                                : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #12141f, #0b0c12); border-radius: 20px;">
                                     <span style="color: rgba(255,255,255,0.3);">Video Not Available</span>
                                   </div>`
                            }
                        </div>
                    `;
                    exercisesContainer.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
